services:
  linksnip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linksnip
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - linksnip-data:/app/data

volumes:
  linksnip-data:

