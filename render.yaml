services:
  - type: web
    name: linksnip
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    disk:
      name: linksnip-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/v1/links

